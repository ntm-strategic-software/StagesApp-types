name: Fast Checks

on:
  push:
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4

      # Match the Node version used by StagesApp-desktop CI (the primary consumer)
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: pnpm

      # postinstall runs the tsc build, so this also verifies compilation
      - run: pnpm install --frozen-lockfile

      - run: pnpm run check-en-locale

      - run: pnpm test
